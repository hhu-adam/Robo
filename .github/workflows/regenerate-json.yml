name: Regenerar Game.json

on:
  push:
    branches: [Spanish-translation]
    paths:
      - '.i18n/es/Game.po'

permissions:
  contents: write

jobs:
  regenerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerar es/Game.json desde Game.po
        run: python3 .i18n/po2json.py es

      - name: Commit y push si hay cambios
        run: |
          if git diff --quiet .i18n/es/Game.json; then
            echo "Game.json ya estaba al día"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .i18n/es/Game.json
          git commit -m "Regenerar es/Game.json desde Game.po [skip ci]"
          git push
