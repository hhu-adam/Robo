name: Validar traducciones

on:
  pull_request:
    paths:
      - '.i18n/**/Game.po'
  push:
    branches: [Spanish-translation]
    paths:
      - '.i18n/**/Game.po'

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar gettext
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext

      - name: Formato .po (msgfmt)
        run: |
          for f in .i18n/*/Game.po; do
            echo "== $f"
            msgfmt -c --statistics -o /dev/null "$f"
          done

      - name: Placeholders y entradas vacías (es)
        run: python3 .i18n/check_po.py es
